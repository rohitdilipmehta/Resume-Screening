[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-review-assistant"
version = "0.1.0"
description = "Evidence-based resume review summaries for human reviewers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
resume-review = "resume_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100